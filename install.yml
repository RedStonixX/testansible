- name: Install CrowdSec + Wazuh
  hosts: all
  become: true

  vars:
    crowdsec_server_ip: "192.168.2.98"
    wazuh_manager_ip: "192.168.2.99"

  tasks:

    #########################################################
    # CROWDSEC
    #########################################################

    - name: Check if CrowdSec is already installed
      stat:
        path: /etc/crowdsec/local_api_credentials.yaml
      register: crowdsec_installed

    - name: Create CrowdSec machine on central
      delegate_to: "{{ crowdsec_server_ip }}"
      shell: |
        cscli machines add {{ inventory_hostname }} -f - --auto
      register: crowdsec_creds
      when: not crowdsec_installed.stat.exists

    - name: Extract CrowdSec password
      set_fact:
        crowdsec_password: >-
          {{
            crowdsec_creds.stdout
            | regex_search('password: (.*)', '\1')
            | first
          }}
      when: not crowdsec_installed.stat.exists

    - name: Install CrowdSec repo
      shell: curl -s https://install.crowdsec.net | sudo sh
      when: not crowdsec_installed.stat.exists

    - name: Apt update
      apt:
        update_cache: yes
      when: not crowdsec_installed.stat.exists

    - name: Install CrowdSec
      apt:
        name: crowdsec
        state: present
      when: not crowdsec_installed.stat.exists

    - name: Configure CrowdSec credentials
      copy:
        dest: /etc/crowdsec/local_api_credentials.yaml
        content: |
          url: http://{{ crowdsec_server_ip }}:8080/

          login: {{ inventory_hostname }}
          password: {{ crowdsec_password }}
      when: not crowdsec_installed.stat.exists

    - name: Restart CrowdSec
      systemd:
        name: crowdsec
        enabled: yes
        state: restarted
      when: not crowdsec_installed.stat.exists


    #########################################################
    # WAZUH
    #########################################################

    - name: Check if Wazuh already installed
      stat:
        path: /var/ossec/bin/wazuh-control
      register: wazuh_installed

    - name: Download Wazuh Agent
      get_url:
        url: https://packages.wazuh.com/4.x/apt/pool/main/w/wazuh-agent/wazuh-agent_4.14.5-1_amd64.deb
        dest: /tmp/wazuh-agent.deb
      when: not wazuh_installed.stat.exists

    - name: Install Wazuh Agent
      shell: |
        WAZUH_MANAGER='{{ wazuh_manager_ip }}' dpkg -i /tmp/wazuh-agent.deb
      when: not wazuh_installed.stat.exists

    - name: Reload systemd
      systemd:
        daemon_reload: yes
      when: not wazuh_installed.stat.exists

    - name: Enable Wazuh
      systemd:
        name: wazuh-agent
        enabled: yes
      when: not wazuh_installed.stat.exists

    - name: Start Wazuh
      systemd:
        name: wazuh-agent
        state: started
      when: not wazuh_installed.stat.exists
